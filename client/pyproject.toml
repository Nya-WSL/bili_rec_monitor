[project]
name = "BILIBILI_Record_Monitor"
version = "1.0.0"
description = "基于 BililiveRecorder 和 Webhook 的BILIBILI录播文件监视器"
authors = [{ name = "Nya-WSL" }]
requires-python = ">=3.9,<3.14"
readme = "README.md"
license = "MIT"

dependencies = [
    "pyyaml>=6.0.2,<7",
    "aiohttp>=3.11.16,<4",
    "ruamel-yaml>=0.18.10,<0.19",
    "tzdata>=2025.2,<2026",
    "py-dateutil>=2.2,<3",
    "websockets>=15.0.1,<16",
    "aiofiles>=25.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
